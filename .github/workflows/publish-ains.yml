name: Publish AINS to PyPI

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    if: github.repository == 'dengyier/AI-Native-System' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build and check AINS distributions
        run: |
          cmp LICENSE.md deployment/ains/LICENSE.md
          python -m pip install build==1.3.0 twine==6.2.0
          python -m build --outdir dist deployment/ains
          python -m twine check --strict dist/*
          python - <<'PY'
          from configparser import ConfigParser
          from email import message_from_bytes
          from pathlib import Path
          import tarfile
          import tomllib
          from zipfile import ZipFile

          from packaging.requirements import Requirement
          from packaging.specifiers import SpecifierSet

          framework = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          version = framework["version"]
          license_text = Path("LICENSE.md").read_bytes()
          expression = framework["license"].removesuffix(" AND MIT")
          assert expression.startswith("LicenseRef-AI-Native-System-Noncommercial-") and " OR " not in expression
          assert framework["name"] == "ai-native-system"

          def check_metadata(contents):
              metadata = message_from_bytes(contents)
              assert metadata["Name"] == "ains"
              assert metadata["Version"] == version
              assert metadata["License-Expression"] == expression
              assert metadata.get_all("License-File") == ["LICENSE.md"]
              assert SpecifierSet(metadata["Requires-Python"]) == SpecifierSet(framework["requires-python"])
              assert metadata.get_all("Provides-Extra") == ["mcp"]
              assert {Requirement(item) for item in metadata.get_all("Requires-Dist")} == {
                  Requirement(f"ai-native-system=={version}"),
                  Requirement(f'ai-native-system[mcp]=={version}; extra == "mcp"'),
              }

          wheel, = Path("dist").glob("*.whl")
          with ZipFile(wheel) as archive:
              metadata_file, = (name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              dist_info = metadata_file.removesuffix("METADATA")
              check_metadata(archive.read(metadata_file))
              assert archive.read(dist_info + "licenses/LICENSE.md") == license_text
              assert {name for name in archive.namelist() if not name.startswith(dist_info)} == {"ains_launcher.py"}
              entries = ConfigParser()
              entries.read_string(archive.read(dist_info + "entry_points.txt").decode())
              assert dict(entries["console_scripts"]) == {
                  "ains": "ai_native_system.__main__:main",
                  "ains-mcp": "ains_launcher:mcp_main",
              }

          sdist, = Path("dist").glob("*.tar.gz")
          with tarfile.open(sdist) as archive:
              prefix = f"ains-{version}/"
              check_metadata(archive.extractfile(prefix + "PKG-INFO").read())
              assert archive.extractfile(prefix + "LICENSE.md").read() == license_text
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ains-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ains-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
