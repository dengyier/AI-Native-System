name: Publish framework to PyPI

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    if: github.repository == 'dengyier/AI-Native-System' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build and check distribution metadata
        run: |
          python -m pip install build==1.3.0 twine==6.2.0
          python -m build
          python -m twine check --strict dist/*
          python - <<'PY'
          from email import message_from_bytes
          from pathlib import Path
          import tomllib
          from zipfile import ZipFile

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          wheel, = Path("dist").glob("*.whl")
          with ZipFile(wheel) as archive:
              metadata_file, = (n for n in archive.namelist() if n.endswith(".dist-info/METADATA"))
              metadata = message_from_bytes(archive.read(metadata_file))
              expression = metadata["License-Expression"]
              assert metadata["Name"] == project["name"] == "ai-native-system"
              assert metadata["Version"] == project["version"]
              assert expression == project["license"]
              assert expression.startswith("LicenseRef-AI-Native-System-Noncommercial-") and " OR " not in expression
              assert "LICENSE.md" in metadata.get_all("License-File", [])
              licenses = metadata_file.removesuffix("METADATA") + "licenses/"
              for source in metadata.get_all("License-File"):
                  assert archive.read(licenses + source) == Path(source).read_bytes()
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: framework-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: framework-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
