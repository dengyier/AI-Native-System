[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-native-system-sdk"
version = "0.1.0"
description = "Python HTTP SDK for the AI Native System application API"
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/dengyier/AI-Native-System"
Documentation = "https://github.com/dengyier/AI-Native-System/tree/main/ai_native_sdk"

[tool.setuptools]
packages = ["ai_native_sdk"]
package-dir = { ai_native_sdk = "." }
include-package-data = false
