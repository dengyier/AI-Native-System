x-restricted: &restricted
  user: "65532:65532"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 32
  mem_limit: 192m
  cpus: 1.0

services:
  model-fixture:
    <<: *restricted
    image: ${AI_NATIVE_ISOLATION_IMAGE:?}
    network_mode: service:agent
    entrypoint: [python, -B, /run/fixture/isolation_fixture.py, model]
    volumes:
      - ${AI_NATIVE_ISOLATION_FIXTURE:?}:/run/fixture/isolation_fixture.py:ro
    depends_on: [agent]

  executor-fixture:
    <<: *restricted
    image: ${AI_NATIVE_ISOLATION_IMAGE:?}
    entrypoint: [python, -B, /run/fixture/isolation_fixture.py, executor]
    networks: [authority]
    environment:
      P9_FIXTURE_BUSINESS_TOKEN: ${AI_NATIVE_ISOLATION_EXECUTOR_CREDENTIAL:?}
    volumes:
      - agent_socket:/run/agent:ro
      - ${AI_NATIVE_ISOLATION_FIXTURE:?}:/run/fixture/isolation_fixture.py:ro
    secrets: [business_token]

  source-fixture:
    <<: *restricted
    image: ${AI_NATIVE_ISOLATION_IMAGE:?}
    entrypoint: [python, -B, /run/fixture/isolation_fixture.py, source]
    networks: [authority]
    volumes:
      - ${AI_NATIVE_ISOLATION_FIXTURE:?}:/run/fixture/isolation_fixture.py:ro
    secrets: [business_token]

  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
    environment:
      POSTGRES_PASSWORD: ${AI_NATIVE_ISOLATION_PG_PASSWORD:?}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    networks: [authority]
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres]
      interval: 2s
      timeout: 3s
      retries: 20

networks:
  authority:
    internal: true

secrets:
  business_token:
    file: ${AI_NATIVE_ISOLATION_BUSINESS_TOKEN_FILE:?}
